
name: Mobile App Ratings Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: ratings-monitor
  cancel-in-progress: false

jobs:
  collect-ratings:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      GOOGLE_SCRIPT_URL: ${{ secrets.GOOGLE_SCRIPT_URL }}
      API_TOKEN: ${{ secrets.API_TOKEN }}

    steps:
      - name: Get repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute notebook
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute \
            --output executed_notebook.ipynb \
            --output-dir /tmp \
            --ExecutePreprocessor.timeout=600 \
            "ТЗ_оценки_из_сторов_для_гита.ipynb"

      - name: Save updated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ratings_history_clean.csv

          if git diff --cached --quiet; then
            echo "CSV не изменился. Новый коммит не нужен."
          else
            git commit -m "Update ratings history"
            git push
          fi

# Scheduled ratings collection
